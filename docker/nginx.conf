# Configuração do servidor estático do painel ODRF.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Compressão para JS, CSS e a base de dados (casos.js tem cerca de 500 KB)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json text/markdown;
    gzip_min_length 1024;

    # Cabeçalhos básicos de segurança para um site estático
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Página e base sem cache, para a apresentação refletir a última geração.
    # Bibliotecas e estilos em cache por um dia.
    location = /index.html { expires -1; }
    location /data/        { expires -1; }
    location /assets/      { expires 1d; }

    # Documentação em Markdown servida como texto
    location /docs/ { types { text/markdown md; } default_type text/markdown; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
